services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    env_file:
      - backend/.env
    environment:
      - NODE_API_URL=http://127.0.0.1:4000
    volumes:
      - node-logs:/var/log
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

volumes:
  node-logs:

networks:
  frontend-net:
  backend-net:
    internal: true
