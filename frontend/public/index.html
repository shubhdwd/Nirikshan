<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!-- Viewport: viewport-fit=cover for iPhone notch/Dynamic Island -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

        <!-- PWA Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <!-- Theme color: teal brand -->
        <meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#14A39A" media="(prefers-color-scheme: dark)" />

        <!-- PWA / Apple Mobile Web App -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Nirikshan" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

        <!-- Apple Touch Icons -->
        <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />

        <!-- Favicon -->
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
        <link rel="icon" type="image/png" sizes="72x72" href="/icons/icon-72.png" />

        <!-- MS Tile -->
        <meta name="msapplication-TileColor" content="#0F766E" />
        <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

        <!-- SEO -->
        <meta name="description" content="Nirikshan — A community-driven civic-tech platform to report and track child safety concerns across India. Making the invisible visible." />
        <meta name="keywords" content="child safety, India, reporting, community, civic-tech, nirikshan" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Nirikshan — Making the Invisible Visible" />
        <meta property="og:description" content="A community-driven civic-tech platform for child safety in India." />
        <meta property="og:image" content="/icons/icon-512.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <title>Nirikshan — Making the Invisible Visible</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
